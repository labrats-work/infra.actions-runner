name: Image

# Pull requests: build only (no push, no secrets) — proves the patches still
# apply, e.g. on Dependabot's base-image bumps.
# Push to main: cut the next semver release from the conventional commits since
# the last one, then build and push ghcr.io/<owner>/<repo>:<version>.

on:
  pull_request:
    paths: ['Dockerfile', 'patches/**', '.github/workflows/image.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', 'patches/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: runner:pr
      - name: Runner starts
        run: docker run --rm --entrypoint /home/runner/bin/Runner.Listener runner:pr --version

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          last=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          log=$(git log --format='%s%n%b' "${last}..HEAD")
          IFS=. read -r major minor patch <<<"$last"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<<"$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tag only — never :latest.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
